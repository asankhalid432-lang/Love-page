<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارتێکی 3D بۆ خێزانی ئازیزم</title>
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            perspective: 1000px;
        }
        .card-container {
            width: 340px;
            height: 480px;
            transform-style: preserve-3d;
            animation: floatCard 4s ease-in-out infinite;
        }
        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            color: #fff;
            transform: rotateX(10deg) rotateY(-10deg);
            transition: transform 0.5s ease;
        }
        .card-container:hover .card {
            transform: rotateX(0deg) rotateY(0deg) scale(1.05);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ul {
            list-style: none;
            padding: 0;
            width: 100%;
        }
        li {
            background: rgba(255, 255, 255, 0.15);
            margin: 10px 0;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        li:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateZ(20px);
        }
        p {
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
            opacity: 0.8;
            line-height: 1.5;
        }
        @keyframes floatCard {
            0%, 100% { transform: translateY(0px) rotateX(5deg) rotateY(-5deg); }
            50% { transform: translateY(-15px) rotateX(-5deg) rotateY(5deg); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="card">
            <h1>✨ خێزانی خۆشەویست و ئازیزم ✨</h1>
            <ul>
                <li>دایە گیان</li>
                <li>باوە گیان</li>
                <li>خاڵە دابان</li>
                <li>پورە ئاڤان</li>
                <li>خاڵە دییار</li>
                <li>دادە لاڤە</li>
            </ul>
            <p>هەمیشە لە دڵ و یادمانداین، هیوای تەندروستی و خۆبەختین بۆ هەمووتان! ❤️</p>
        </div>
    </div>

</body>
</html>
